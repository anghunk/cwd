<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex">
		<link rel="canonical" href="https://cwd.js.org/config/site-isolation">
		<title>正在跳转至文档新地址</title>
		<script>
			const target = new URL("/config/site-isolation", window.location.href);
			target.search = window.location.search;
			target.hash = window.location.hash;
			window.location.replace(target.href);
		</script>
		<noscript><meta http-equiv="refresh" content="0;url=/config/site-isolation"></noscript>
	</head>
	<body>
		<p>此页面已迁移，<a href="/config/site-isolation">前往文档新地址</a>。</p>
	</body>
</html>
