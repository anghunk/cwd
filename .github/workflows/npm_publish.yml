name: Publish npm

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'anghunk/cwd'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # 不设置 registry-url：setup-node 会写入带占位 token 的 .npmrc，导致 npm 走 token 分支而跳过 OIDC
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Trusted Publishing 需要 npm CLI 11.5.1 以上，Node 22 自带的是 10.x
      - name: Update npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Get local package info
        id: pkg
        working-directory: docs-nimbus/widget
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Get npm published version
        id: npm
        run: |
          PUBLISHED_VERSION=$(npm view "${{ steps.pkg.outputs.name }}" version || echo "none")
          echo "version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT

      - name: Decide whether to publish
        id: decision
        run: |
          echo "local=${{ steps.pkg.outputs.version }}"
          echo "remote=${{ steps.npm.outputs.version }}"
          if [ "${{ steps.npm.outputs.version }}" = "none" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.pkg.outputs.version }}" != "${{ steps.npm.outputs.version }}" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.decision.outputs.should_publish == 'true'
        working-directory: docs-nimbus/widget
        run: npm install

      - name: Build widget
        if: steps.decision.outputs.should_publish == 'true'
        working-directory: docs-nimbus/widget
        run: npm run build

      - name: Publish to npm
        if: steps.decision.outputs.should_publish == 'true'
        working-directory: docs-nimbus/widget
        run: npm publish --access public
